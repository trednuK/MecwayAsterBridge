<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <rect width="720" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- top view of the weld face: path from the start point, source at s = v (t - t0) -->
  <rect x="40" y="30" width="640" height="180" fill="#eef3f8" stroke="#999" stroke-width="1"/>
  <line x1="100" y1="120" x2="660" y2="120" stroke="#666" stroke-width="1.5" stroke-dasharray="10 6"/>
  <line x1="560" y1="120" x2="650" y2="120" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="652" y="108" font-family="serif" font-style="italic" font-size="22" fill="#333">ξ</text>
  <line x1="380" y1="200" x2="380" y2="42" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="388" y="50" font-family="serif" font-style="italic" font-size="22" fill="#333">η</text>
  <!-- double ellipsoid: front quarter af, rear ar, half width b -->
  <path d="M 380 70 A 90 50 0 0 1 380 170" fill="#f2c9a0" fill-opacity="0.8" stroke="#a0522d" stroke-width="2"/>
  <path d="M 380 70 A 180 50 0 0 0 380 170" fill="#f8dfc4" fill-opacity="0.8" stroke="#a0522d" stroke-width="2"/>
  <circle cx="100" cy="120" r="7" fill="#333"/>
  <circle cx="380" cy="120" r="5" fill="#333"/>
  <!-- dimensions in the top view -->
  <line x1="384" y1="132" x2="468" y2="132" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="202" y1="132" x2="376" y2="132" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="410" y1="116" x2="410" y2="74" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="104" y1="190" x2="376" y2="190" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- side section along the path: surface at y = 260, depth downwards -->
  <rect x="40" y="260" width="640" height="150" fill="#eef3f8" stroke="none"/>
  <line x1="40" y1="260" x2="680" y2="260" stroke="#333" stroke-width="2"/>
  <path d="M 470 260 A 90 80 0 0 1 380 340 L 380 260 Z" fill="#f2c9a0" fill-opacity="0.8" stroke="#a0522d" stroke-width="2"/>
  <path d="M 380 340 A 180 80 0 0 1 200 260 L 380 260 Z" fill="#f8dfc4" fill-opacity="0.8" stroke="#a0522d" stroke-width="2"/>
  <circle cx="380" cy="260" r="5" fill="#333"/>
  <line x1="372" y1="264" x2="372" y2="336" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- depth direction (into the material) -->
  <line x1="600" y1="270" x2="600" y2="360" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="610" y="364" font-family="serif" font-style="italic" font-size="22" fill="#333">ζ</text>
  <line x1="560" y1="300" x2="650" y2="300" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="652" y="296" font-family="serif" font-style="italic" font-size="22" fill="#333">ξ</text>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="100" cy="94" r="11" fill="#c0392b"/><text x="100" y="99">1</text>
    <circle cx="610" cy="140" r="11" fill="#c0392b"/><text x="610" y="145">2</text>
    <circle cx="240" cy="174" r="11" fill="#c0392b"/><text x="240" y="179">3</text>
    <circle cx="430" cy="150" r="11" fill="#c0392b"/><text x="430" y="155">4</text>
    <circle cx="280" cy="150" r="11" fill="#c0392b"/><text x="280" y="155">5</text>
    <circle cx="432" cy="92" r="11" fill="#c0392b"/><text x="432" y="97">6</text>
    <circle cx="350" cy="300" r="11" fill="#c0392b"/><text x="350" y="305">7</text>
    <circle cx="630" cy="330" r="11" fill="#c0392b"/><text x="630" y="335">8</text>
  </g>
</svg>

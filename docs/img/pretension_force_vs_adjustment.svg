<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <!-- axes -->
  <g stroke="#333" stroke-width="2">
    <line x1="80" y1="330" x2="580" y2="330"/>
    <polygon points="594,330 578,323 578,337" fill="#333"/>
    <line x1="80" y1="330" x2="80" y2="40"/>
    <polygon points="80,26 73,42 87,42" fill="#333"/>
  </g>
  <text x="586" y="360" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">P</text>
  <text x="30" y="40" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">F</text>
  <text x="42" y="46" font-family="sans-serif" font-size="12" font-style="italic" fill="#333">b</text>
  <!-- force mode: constant -->
  <line x1="80" y1="190" x2="560" y2="190" stroke="#333" stroke-width="2"/>
  <!-- length adjustment: Fp + P kb/(kb+kc) -->
  <line x1="80" y1="190" x2="560" y2="70" stroke="#333" stroke-width="2" stroke-dasharray="10 6"/>
  <!-- slope triangle -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <polyline points="380,115 480,115 480,90"/>
  </g>
  <text x="488" y="108" font-family="sans-serif" font-size="15" font-style="italic" fill="#333">k</text>
  <text x="498" y="112" font-family="sans-serif" font-size="11" font-style="italic" fill="#333">b</text>
  <text x="506" y="108" font-family="sans-serif" font-size="15" fill="#333">/(</text>
  <text x="520" y="108" font-family="sans-serif" font-size="15" font-style="italic" fill="#333">k</text>
  <text x="530" y="112" font-family="sans-serif" font-size="11" font-style="italic" fill="#333">b</text>
  <text x="538" y="108" font-family="sans-serif" font-size="15" fill="#333">+</text>
  <text x="550" y="108" font-family="sans-serif" font-size="15" font-style="italic" fill="#333">k</text>
  <text x="560" y="112" font-family="sans-serif" font-size="11" font-style="italic" fill="#333">c</text>
  <text x="568" y="108" font-family="sans-serif" font-size="15" fill="#333">)</text>
  <!-- tick at Fp -->
  <line x1="72" y1="190" x2="88" y2="190" stroke="#333" stroke-width="2"/>
  <!-- markers -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="420" cy="212" r="11" fill="#c0392b"/><text x="420" y="217">1</text>
    <circle cx="300" cy="112" r="11" fill="#c0392b"/><text x="300" y="117">2</text>
    <circle cx="52" cy="190" r="11" fill="#c0392b"/><text x="52" y="195">3</text>
  </g>
</svg>

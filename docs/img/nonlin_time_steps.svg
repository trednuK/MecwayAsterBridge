<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- load factor of the load table against time; t = 0 at x = 70, period T at x = 570 (5 steps of 100) -->
  <line x1="70" y1="250" x2="700" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="70" y1="250" x2="70" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="44" y="46" font-family="serif" font-style="italic" font-size="22" fill="#333">λ</text>
  <text x="692" y="274" font-family="serif" font-style="italic" font-size="20" fill="#333">t</text>
  <!-- load table: kink at t = 2.25 dt (x = 295), points after T dropped -->
  <polyline points="70,250 295,90 570,60" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <polyline points="570,60 650,150" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#2c5d8a"><circle cx="70" cy="250" r="4.5"/><circle cx="295" cy="90" r="4.5"/></g>
  <circle cx="650" cy="150" r="4.5" fill="#ffffff" stroke="#aaa" stroke-width="2"/>
  <line x1="570" y1="40" x2="570" y2="250" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4"/>
  <line x1="295" y1="90" x2="295" y2="250" stroke="#2c5d8a" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- solver times on the time axis: Mecway steps (ticks) and the kink (diamond) -->
  <g stroke="#333" stroke-width="2">
    <line x1="170" y1="242" x2="170" y2="258"/>
    <line x1="270" y1="242" x2="270" y2="258"/>
    <line x1="370" y1="242" x2="370" y2="258"/>
    <line x1="470" y1="242" x2="470" y2="258"/>
    <line x1="570" y1="242" x2="570" y2="258"/>
  </g>
  <path d="M295 241 L304 250 L295 259 L286 250 Z" fill="#c8d9ea" stroke="#2c5d8a" stroke-width="2"/>
  <line x1="70" y1="276" x2="170" y2="276" stroke="#333" stroke-width="1.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="108" y="298" font-family="serif" font-style="italic" font-size="18" fill="#333">dt</text>
  <text x="562" y="292" font-family="serif" font-style="italic" font-size="18" fill="#333">T</text>
  <!-- a step that does not converge (370 .. 470) is cut into 4 equal steps; one of them again into 4 -->
  <line x1="370" y1="258" x2="250" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="470" y1="258" x2="650" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="250" y1="330" x2="650" y2="330" stroke="#333" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="2">
    <line x1="250" y1="320" x2="250" y2="340"/>
    <line x1="350" y1="322" x2="350" y2="338"/>
    <line x1="450" y1="322" x2="450" y2="338"/>
    <line x1="550" y1="322" x2="550" y2="338"/>
    <line x1="650" y1="320" x2="650" y2="340"/>
  </g>
  <line x1="350" y1="338" x2="290" y2="372" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="450" y1="338" x2="510" y2="372" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="290" y1="380" x2="510" y2="380" stroke="#333" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="290" y1="372" x2="290" y2="388"/>
    <line x1="345" y1="374" x2="345" y2="386"/>
    <line x1="400" y1="374" x2="400" y2="386"/>
    <line x1="455" y1="374" x2="455" y2="386"/>
    <line x1="510" y1="372" x2="510" y2="388"/>
  </g>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="120" cy="316" r="11" fill="#c0392b"/><text x="120" y="321">1</text>
    <circle cx="318" cy="222" r="11" fill="#c0392b"/><text x="318" y="227">2</text>
    <circle cx="592" cy="40" r="11" fill="#c0392b"/><text x="592" y="45">3</text>
    <circle cx="672" cy="132" r="11" fill="#c0392b"/><text x="672" y="137">4</text>
    <circle cx="672" cy="330" r="11" fill="#c0392b"/><text x="672" y="335">5</text>
    <circle cx="534" cy="380" r="11" fill="#c0392b"/><text x="534" y="385">6</text>
  </g>
</svg>

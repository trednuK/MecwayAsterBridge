<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <rect width="720" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="1.2"/>
    </pattern>
    <clipPath id="inset">
      <rect x="555" y="130" width="150" height="140"/>
    </clipPath>
  </defs>
  <!-- axis of symmetry (Mecway Y) and radius (Mecway X) -->
  <line x1="50" y1="300" x2="50" y2="40" stroke="#333" stroke-width="2" stroke-dasharray="14 5 3 5" marker-end="url(#ah)"/>
  <text x="62" y="52" font-family="sans-serif" font-size="20" fill="#333">Y</text>
  <line x1="50" y1="250" x2="545" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="526" y="240" font-family="sans-serif" font-size="20" fill="#333">X</text>
  <!-- inner ring (cross-section), its outer edge overlaps the outer ring (drawn enlarged) -->
  <polygon points="150,150 336,150 336,250 150,250" fill="#d6e4f0" stroke="#333" stroke-width="2"/>
  <line x1="196.5" y1="150" x2="196.5" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="243" y1="150" x2="243" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="289.5" y1="150" x2="289.5" y2="250" stroke="#333" stroke-width="1"/>
  <!-- outer ring -->
  <polygon points="324,150 510,150 510,250 324,250" fill="#e3e3e3" fill-opacity="0.8" stroke="#333" stroke-width="2"/>
  <line x1="370.5" y1="150" x2="370.5" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="417" y1="150" x2="417" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="463.5" y1="150" x2="463.5" y2="250" stroke="#333" stroke-width="1"/>
  <rect x="324" y="150" width="12" height="100" fill="url(#hatch)"/>
  <line x1="336" y1="150" x2="336" y2="250" stroke="#c0392b" stroke-width="3"/>
  <line x1="324" y1="150" x2="324" y2="250" stroke="#333" stroke-width="3" stroke-dasharray="7 4"/>
  <!-- rollers: displacement along Y = 0 on the bottom and top edges of both rings -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <circle cx="173" cy="256" r="6"/><circle cx="243" cy="256" r="6"/><circle cx="300" cy="256" r="6"/>
    <circle cx="370" cy="256" r="6"/><circle cx="440" cy="256" r="6"/><circle cx="487" cy="256" r="6"/>
    <circle cx="173" cy="144" r="6"/><circle cx="243" cy="144" r="6"/><circle cx="300" cy="144" r="6"/>
    <circle cx="370" cy="144" r="6"/><circle cx="440" cy="144" r="6"/><circle cx="487" cy="144" r="6"/>
  </g>
  <line x1="150" y1="263" x2="510" y2="263" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="137" x2="510" y2="137" stroke="#333" stroke-width="2"/>
  <path d="M165,263 l-7,8 M195,263 l-7,8 M225,263 l-7,8 M255,263 l-7,8 M285,263 l-7,8 M315,263 l-7,8 M345,263 l-7,8 M375,263 l-7,8 M405,263 l-7,8 M435,263 l-7,8 M465,263 l-7,8 M495,263 l-7,8" stroke="#333" stroke-width="1.2"/>
  <path d="M165,137 l7,-8 M195,137 l7,-8 M225,137 l7,-8 M255,137 l7,-8 M285,137 l7,-8 M315,137 l7,-8 M345,137 l7,-8 M375,137 l7,-8 M405,137 l7,-8 M435,137 l7,-8 M465,137 l7,-8 M495,137 l7,-8" stroke="#333" stroke-width="1.2"/>
  <!-- zoom of the contact region -->
  <rect x="316" y="146" width="28" height="108" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="344" y1="146" x2="555" y2="130" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="344" y1="254" x2="555" y2="270" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <g clip-path="url(#inset)">
    <rect x="555" y="130" width="150" height="140" fill="#ffffff"/>
    <rect x="555" y="130" width="95" height="140" fill="#d6e4f0"/>
    <rect x="610" y="130" width="95" height="140" fill="#e3e3e3" fill-opacity="0.8"/>
    <rect x="610" y="130" width="40" height="140" fill="url(#hatch)"/>
    <line x1="650" y1="130" x2="650" y2="270" stroke="#c0392b" stroke-width="4"/>
    <line x1="610" y1="130" x2="610" y2="270" stroke="#333" stroke-width="4" stroke-dasharray="9 5"/>
  </g>
  <rect x="555" y="130" width="150" height="140" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- interference: overlap of the two edges -->
  <line x1="610" y1="112" x2="610" y2="126" stroke="#333" stroke-width="1"/>
  <line x1="650" y1="112" x2="650" y2="126" stroke="#333" stroke-width="1"/>
  <line x1="610" y1="118" x2="650" y2="118" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="623" y="106" font-family="serif" font-style="italic" font-size="22" fill="#333">δ</text>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="30" cy="70" r="11" fill="#c0392b"/><text x="30" y="75">1</text>
    <circle cx="220" cy="200" r="11" fill="#c0392b"/><text x="220" y="205">2</text>
    <circle cx="440" cy="200" r="11" fill="#c0392b"/><text x="440" y="205">3</text>
    <circle cx="650" cy="292" r="11" fill="#c0392b"/><text x="650" y="297">4</text>
    <circle cx="610" cy="292" r="11" fill="#c0392b"/><text x="610" y="297">5</text>
    <circle cx="678" cy="106" r="11" fill="#c0392b"/><text x="678" y="111">6</text>
    <circle cx="128" cy="280" r="11" fill="#c0392b"/><text x="128" y="285">7</text>
  </g>
</svg>

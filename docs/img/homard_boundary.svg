<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <!-- left: without boundary following; right: with -->
  <g transform="translate(40,40)">
    <!-- true circle (dashed) -->
    <path d="M0,250 A250,250 0 0 1 250,0" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>
    <!-- coarse faces: polygon of the coarse mesh on the circle -->
    <polyline points="0,250 19.0,154.3 73.2,73.2 154.3,19.0 250,0" fill="none" stroke="#333" stroke-width="2"/>
    <g fill="#333">
      <circle cx="0" cy="250" r="4"/><circle cx="19.0" cy="154.3" r="4"/><circle cx="73.2" cy="73.2" r="4"/>
      <circle cx="154.3" cy="19.0" r="4"/><circle cx="250" cy="0" r="4"/>
    </g>
    <!-- new node on the straight edge (midpoint) -->
    <circle cx="46.1" cy="113.8" r="5" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <!-- centre and axis symbol -->
    <circle cx="250" cy="250" r="5" fill="#333"/>
    <line x1="250" y1="250" x2="73.2" y2="73.2" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <g transform="translate(400,40)">
    <path d="M0,250 A250,250 0 0 1 250,0" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>
    <polyline points="0,250 4.8,201.2 19.0,154.3 42.1,111.1 73.2,73.2 154.3,19.0 250,0" fill="none" stroke="#333" stroke-width="2"/>
    <g fill="#333">
      <circle cx="0" cy="250" r="4"/><circle cx="19.0" cy="154.3" r="4"/><circle cx="73.2" cy="73.2" r="4"/>
      <circle cx="154.3" cy="19.0" r="4"/><circle cx="250" cy="0" r="4"/>
    </g>
    <!-- new nodes on the circle -->
    <circle cx="4.8" cy="201.2" r="5" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <circle cx="42.1" cy="111.1" r="5" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <circle cx="250" cy="250" r="5" fill="#333"/>
    <line x1="250" y1="250" x2="42.1" y2="111.1" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">
    <circle cx="300" cy="300" r="11" fill="#c0392b"/><text x="300" y="305">1</text>
    <circle cx="100" cy="185" r="11" fill="#c0392b"/><text x="100" y="190">2</text>
    <circle cx="140" cy="60" r="11" fill="#c0392b"/><text x="140" y="65">3</text>
    <circle cx="420" cy="125" r="11" fill="#c0392b"/><text x="420" y="130">4</text>
    <circle cx="560" cy="45" r="11" fill="#c0392b"/><text x="560" y="50">5</text>
  </g>
</svg>

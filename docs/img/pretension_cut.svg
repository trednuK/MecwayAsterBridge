<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <!-- nut (top) -->
    <rect x="190" y="40" width="140" height="40" fill="#e8e8e8"/>
    <!-- shank, upper part -->
    <rect x="230" y="80" width="60" height="150" fill="#f4f4f4"/>
    <!-- shank, lower part -->
    <rect x="230" y="236" width="60" height="150" fill="#dde6f0"/>
    <!-- head (bottom) -->
    <rect x="190" y="386" width="140" height="40" fill="#e8e8e8"/>
    <!-- element layers in the shank -->
    <line x1="230" y1="130" x2="290" y2="130"/>
    <line x1="230" y1="180" x2="290" y2="180"/>
    <line x1="230" y1="286" x2="290" y2="286"/>
    <line x1="230" y1="336" x2="290" y2="336"/>
  </g>
  <!-- selected faces (exterior faces of the shank over the extent) -->
  <g stroke="#c0392b" stroke-width="5">
    <line x1="230" y1="130" x2="230" y2="230"/>
    <line x1="230" y1="236" x2="230" y2="336"/>
    <line x1="290" y1="130" x2="290" y2="230"/>
    <line x1="290" y1="236" x2="290" y2="336"/>
  </g>
  <!-- section (cut) -->
  <line x1="200" y1="233" x2="320" y2="233" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- axis n -->
  <g stroke="#333" stroke-width="2">
    <line x1="120" y1="400" x2="120" y2="70"/>
    <polygon points="120,58 113,74 127,74" fill="#333"/>
  </g>
  <text x="104" y="60" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">n</text>
  <!-- axial extent bracket -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="350" y1="130" x2="350" y2="336"/>
    <line x1="342" y1="130" x2="358" y2="130"/>
    <line x1="342" y1="336" x2="358" y2="336"/>
    <line x1="342" y1="233" x2="358" y2="233"/>
  </g>
  <!-- detail: node pair at the section -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <rect x="430" y="120" width="230" height="240"/>
    <line x1="430" y1="215" x2="660" y2="215"/>
    <line x1="430" y1="265" x2="660" y2="265" stroke-dasharray="6 4"/>
    <line x1="545" y1="215" x2="545" y2="265"/>
    <polygon points="545,215 540,226 550,226" fill="#333"/>
    <polygon points="545,265 540,254 550,254" fill="#333"/>
  </g>
  <circle cx="500" cy="215" r="7" fill="#333"/>
  <circle cx="500" cy="265" r="7" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="556" y="246" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">δ</text>
  <!-- reference node with force / shortening -->
  <g stroke="#333" stroke-width="2">
    <rect x="590" y="395" width="16" height="16" fill="#ffffff"/>
    <line x1="606" y1="403" x2="660" y2="403"/>
    <polygon points="672,403 656,396 656,410" fill="#333"/>
  </g>
  <text x="634" y="390" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">F, δ</text>
  <!-- markers -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="205" cy="180" r="11" fill="#c0392b"/><text x="205" y="185">1</text>
    <circle cx="145" cy="110" r="11" fill="#c0392b"/><text x="145" y="115">2</text>
    <circle cx="375" cy="180" r="11" fill="#c0392b"/><text x="375" y="185">3</text>
    <circle cx="375" cy="233" r="11" fill="#c0392b"/><text x="375" y="238">4</text>
    <circle cx="260" cy="311" r="11" fill="#c0392b"/><text x="260" y="316">5</text>
    <circle cx="260" cy="155" r="11" fill="#c0392b"/><text x="260" y="160">6</text>
    <circle cx="470" cy="215" r="11" fill="#c0392b"/><text x="470" y="220">7</text>
    <circle cx="470" cy="265" r="11" fill="#c0392b"/><text x="470" y="270">8</text>
    <circle cx="570" cy="403" r="11" fill="#c0392b"/><text x="570" y="408">9</text>
  </g>
</svg>

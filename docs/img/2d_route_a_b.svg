<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- divider between the two routes -->
  <line x1="360" y1="15" x2="360" y2="365" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- left: route B, a Mecway 2D analysis type (axes X and Y only) -->
  <line x1="50" y1="340" x2="150" y2="340" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="156" y="346" font-family="sans-serif" font-size="18" fill="#333">X</text>
  <line x1="50" y1="340" x2="50" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="40" y="232" font-family="sans-serif" font-size="18" fill="#333">Y</text>
  <polygon points="110,140 310,140 310,270 110,270" fill="#d6e4f0" stroke="#333" stroke-width="2"/>
  <line x1="176.7" y1="140" x2="176.7" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="243.3" y1="140" x2="243.3" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="110" y1="205" x2="310" y2="205" stroke="#333" stroke-width="1"/>

  <!-- right: route A, a Mecway 3D analysis type (axes X, Y, Z): the same elements as shells -->
  <line x1="410" y1="340" x2="510" y2="340" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="516" y="346" font-family="sans-serif" font-size="18" fill="#333">X</text>
  <line x1="410" y1="340" x2="410" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="400" y="232" font-family="sans-serif" font-size="18" fill="#333">Y</text>
  <line x1="410" y1="340" x2="380" y2="366" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="364" y="376" font-family="sans-serif" font-size="18" fill="#333">Z</text>
  <!-- shell thickness behind the meshed face -->
  <polygon points="470,140 670,140 690,120 490,120" fill="#eeeeee" stroke="#333" stroke-width="1.5"/>
  <polygon points="670,140 690,120 690,250 670,270" fill="#e3e3e3" stroke="#333" stroke-width="1.5"/>
  <polygon points="470,140 670,140 670,270 470,270" fill="#d6e4f0" stroke="#333" stroke-width="2"/>
  <line x1="536.7" y1="140" x2="536.7" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="603.3" y1="140" x2="603.3" y2="270" stroke="#333" stroke-width="1"/>
  <line x1="470" y1="205" x2="670" y2="205" stroke="#333" stroke-width="1"/>
  <!-- thickness dimension -->
  <line x1="680" y1="282" x2="700" y2="262" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="664" y="302" font-family="serif" font-style="italic" font-size="22" fill="#333">t</text>

  <!-- the text field of the custom model definition, with one line -->
  <rect x="385" y="22" width="175" height="74" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="397" y1="38" x2="530" y2="38" stroke="#bbb" stroke-width="4"/>
  <line x1="397" y1="52" x2="505" y2="52" stroke="#bbb" stroke-width="4"/>
  <line x1="397" y1="66" x2="495" y2="66" stroke="#c0392b" stroke-width="4"/>
  <line x1="397" y1="80" x2="470" y2="80" stroke="#bbb" stroke-width="4"/>
  <line x1="472" y1="98" x2="545" y2="136" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="94" cy="124" r="11" fill="#c0392b"/><text x="94" y="129">1</text>
    <circle cx="452" cy="124" r="11" fill="#c0392b"/><text x="452" y="129">2</text>
    <circle cx="705" cy="300" r="11" fill="#c0392b"/><text x="705" y="305">3</text>
    <circle cx="578" cy="34" r="11" fill="#c0392b"/><text x="578" y="39">4</text>
    <circle cx="512" cy="66" r="11" fill="#c0392b"/><text x="512" y="71">5</text>
  </g>
</svg>

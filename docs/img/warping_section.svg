<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <!-- C profile 50 x 100 x 6 mm at 3 px/mm: web left, flanges to the right -->
  <path d="M150 60 H300 V78 H168 V342 H300 V360 H150 Z" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <!-- local axes from the centroid G (194, 210): y = V up, z = W right -->
  <line x1="194" y1="210" x2="194" y2="30" stroke="#333" stroke-width="1.5"/>
  <path d="M194 22 L188 36 L200 36 Z" fill="#333"/>
  <text x="204" y="34" font-family="sans-serif" font-size="20" font-style="italic" fill="#333">y</text>
  <line x1="194" y1="210" x2="420" y2="210" stroke="#333" stroke-width="1.5"/>
  <path d="M428 210 L414 204 L414 216 Z" fill="#333"/>
  <text x="424" y="236" font-family="sans-serif" font-size="20" font-style="italic" fill="#333">z</text>
  <!-- centroid G -->
  <circle cx="194" cy="210" r="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M194 202 A8 8 0 0 1 202 210 L194 210 Z M194 218 A8 8 0 0 1 186 210 L194 210 Z" fill="#333"/>
  <text x="200" y="196" font-family="sans-serif" font-size="18" fill="#333">G</text>
  <!-- shear centre S, 29.3 mm left of G -->
  <line x1="98" y1="202" x2="114" y2="218" stroke="#333" stroke-width="2"/>
  <line x1="98" y1="218" x2="114" y2="202" stroke="#333" stroke-width="2"/>
  <circle cx="106" cy="210" r="9" fill="none" stroke="#333" stroke-width="2"/>
  <text x="84" y="196" font-family="sans-serif" font-size="18" fill="#333">S</text>
  <!-- twist about S (rotation about x, with warping GRX) -->
  <path d="M76 250 A40 40 0 1 1 136 250" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M136 250 L124 252 L132 240 Z" fill="#333"/>
  <text x="54" y="276" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">θx</text>
  <!-- EZ: vector S -> G -->
  <line x1="106" y1="300" x2="186" y2="300" stroke="#333" stroke-width="1.5"/>
  <path d="M194 300 L180 294 L180 306 Z" fill="#333"/>
  <line x1="106" y1="225" x2="106" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="194" y1="225" x2="194" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="128" y="292" font-family="sans-serif" font-size="18" fill="#333">EZ</text>
  <!-- markers -->
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="232" cy="174" r="11" fill="#c0392b"/><text x="232" y="179">1</text>
    <circle cx="70" cy="180" r="11" fill="#c0392b"/><text x="70" y="185">2</text>
    <circle cx="86" cy="300" r="11" fill="#c0392b"/><text x="86" y="305">3</text>
    <circle cx="170" cy="36" r="11" fill="#c0392b"/><text x="170" y="41">4</text>
    <circle cx="454" cy="210" r="11" fill="#c0392b"/><text x="454" y="215">5</text>
    <circle cx="40" cy="250" r="11" fill="#c0392b"/><text x="40" y="255">6</text>
  </g>
</svg>

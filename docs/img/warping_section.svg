<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <!-- C profile 50 x 100 x 6 mm at 3 px/mm: web right (at +W, as Mecway
       places it: bridge_warping.mecway_frame), flanges to the left -->
  <path d="M450 60 H300 V78 H432 V342 H300 V360 H450 Z" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <!-- local axes from the centroid G (406, 210): y = V up, z = W right -->
  <line x1="406" y1="210" x2="406" y2="30" stroke="#333" stroke-width="1.5"/>
  <path d="M406 22 L400 36 L412 36 Z" fill="#333"/>
  <text x="416" y="34" font-family="sans-serif" font-size="20" font-style="italic" fill="#333">y</text>
  <line x1="406" y1="210" x2="632" y2="210" stroke="#333" stroke-width="1.5"/>
  <path d="M640 210 L626 204 L626 216 Z" fill="#333"/>
  <text x="636" y="236" font-family="sans-serif" font-size="20" font-style="italic" fill="#333">z</text>
  <!-- centroid G -->
  <circle cx="406" cy="210" r="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <path d="M406 202 A8 8 0 0 1 414 210 L406 210 Z M406 218 A8 8 0 0 1 398 210 L406 210 Z" fill="#333"/>
  <text x="380" y="196" font-family="sans-serif" font-size="18" fill="#333">G</text>
  <!-- shear centre S, 29.3 mm from G on the web side (+z) -->
  <circle cx="494" cy="210" r="9" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <line x1="486" y1="202" x2="502" y2="218" stroke="#333" stroke-width="2"/>
  <line x1="486" y1="218" x2="502" y2="202" stroke="#333" stroke-width="2"/>
  <text x="506" y="196" font-family="sans-serif" font-size="18" fill="#333">S</text>
  <!-- twist about S (rotation about x, with warping GRX) -->
  <path d="M464 250 A40 40 0 1 1 524 250" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M524 250 L512 252 L520 240 Z" fill="#333"/>
  <text x="530" y="290" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">θx</text>
  <!-- EZ: vector S -> G (negative z) -->
  <line x1="494" y1="300" x2="414" y2="300" stroke="#333" stroke-width="1.5"/>
  <path d="M406 300 L420 294 L420 306 Z" fill="#333"/>
  <line x1="494" y1="225" x2="494" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="406" y1="225" x2="406" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="440" y="292" font-family="sans-serif" font-size="18" fill="#333">EZ</text>
  <!-- markers -->
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="364" cy="174" r="11" fill="#c0392b"/><text x="364" y="179">1</text>
    <circle cx="532" cy="176" r="11" fill="#c0392b"/><text x="532" y="181">2</text>
    <circle cx="514" cy="300" r="11" fill="#c0392b"/><text x="514" y="305">3</text>
    <circle cx="382" cy="36" r="11" fill="#c0392b"/><text x="382" y="41">4</text>
    <circle cx="666" cy="210" r="11" fill="#c0392b"/><text x="666" y="215">5</text>
    <circle cx="562" cy="262" r="11" fill="#c0392b"/><text x="562" y="267">6</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
  </defs>
  <!-- axis of symmetry (Mecway Y) -->
  <line x1="120" y1="400" x2="120" y2="30" stroke="#333" stroke-width="2" stroke-dasharray="14 5 3 5" marker-end="url(#ah)"/>
  <text x="132" y="42" font-family="sans-serif" font-size="20" fill="#333">Y</text>
  <!-- radius (Mecway X) -->
  <line x1="120" y1="390" x2="610" y2="390" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="598" y="415" font-family="sans-serif" font-size="20" fill="#333">X</text>
  <!-- Z out of the drawing -->
  <circle cx="120" cy="390" r="9" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="120" cy="390" r="2.5" fill="#333"/>
  <text x="92" y="418" font-family="sans-serif" font-size="20" fill="#333">Z</text>
  <!-- the shell: thickness band around the line of nodes (mid-surface) -->
  <rect x="372" y="70" width="16" height="280" fill="#d6e4f0" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="70" x2="380" y2="350" stroke="#333" stroke-width="2"/>
  <!-- nodes: element 1 = node 1 (top), midside, node 2; element 2 below -->
  <circle cx="380" cy="350" r="6" fill="#333"/>
  <circle cx="380" cy="280" r="4.5" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="380" cy="210" r="6" fill="#333"/>
  <circle cx="380" cy="140" r="4.5" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="380" cy="70" r="6" fill="#333"/>
  <!-- U: node 1 -> node 2 (downwards) -->
  <line x1="420" y1="222" x2="420" y2="340" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="430" y="290" font-family="serif" font-style="italic" font-size="22" fill="#333">U</text>
  <!-- n = Z x U (away from the axis) -->
  <line x1="388" y1="120" x2="470" y2="120" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="458" y="110" font-family="serif" font-style="italic" font-size="22" fill="#333">n</text>
  <!-- positive pressure on faceid 1: on the face opposite n, pushes along +n (as Mecway draws it) -->
  <g stroke="#2471a3" stroke-width="2" marker-end="url(#ab)">
    <line x1="318" y1="95" x2="368" y2="95"/>
    <line x1="318" y1="150" x2="368" y2="150"/>
    <line x1="318" y1="300" x2="368" y2="300"/>
    <line x1="318" y1="335" x2="368" y2="335"/>
  </g>
  <!-- thickness t -->
  <line x1="372" y1="30" x2="372" y2="66" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="388" y1="30" x2="388" y2="66" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="340" y1="40" x2="370" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="420" y1="40" x2="390" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="428" y="46" font-family="serif" font-style="italic" font-size="22" fill="#333">t</text>
  <!-- radius R of the shell -->
  <line x1="120" y1="372" x2="380" y2="372" stroke="#333" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- top surface (u1, side of n) and bottom surface (b1) -->
  <line x1="351" y1="200" x2="371" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="389" y1="180" x2="409" y2="180" stroke="#c0392b" stroke-width="1.5"/>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="96" cy="70" r="11" fill="#c0392b"/><text x="96" y="75">1</text>
    <circle cx="350" cy="280" r="11" fill="#c0392b"/><text x="350" y="285">2</text>
    <circle cx="452" cy="250" r="11" fill="#c0392b"/><text x="452" y="255">3</text>
    <circle cx="500" cy="120" r="11" fill="#c0392b"/><text x="500" y="125">4</text>
    <circle cx="300" cy="122" r="11" fill="#c0392b"/><text x="300" y="127">5</text>
    <circle cx="460" cy="40" r="11" fill="#c0392b"/><text x="460" y="45">6</text>
    <circle cx="62" cy="410" r="11" fill="#c0392b"/><text x="62" y="415">7</text>
    <circle cx="340" cy="200" r="11" fill="#c0392b"/><text x="340" y="205">8</text>
    <circle cx="420" cy="180" r="11" fill="#c0392b"/><text x="420" y="185">9</text>
  </g>
</svg>

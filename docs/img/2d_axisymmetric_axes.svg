<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <rect width="720" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- revolved ring (perspective ellipses, the body the element represents) -->
  <ellipse cx="330" cy="230" rx="270" ry="55" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <ellipse cx="330" cy="170" rx="270" ry="55" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <ellipse cx="330" cy="230" rx="160" ry="33" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <ellipse cx="330" cy="170" rx="160" ry="33" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- axis of symmetry (Mecway Y) -->
  <line x1="330" y1="430" x2="330" y2="40" stroke="#333" stroke-width="2" stroke-dasharray="14 5 3 5" marker-end="url(#ah)"/>
  <text x="342" y="52" font-family="sans-serif" font-size="20" fill="#333">Y</text>
  <!-- radius (Mecway X) -->
  <line x1="330" y1="390" x2="690" y2="390" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="680" y="415" font-family="sans-serif" font-size="20" fill="#333">X</text>
  <text x="312" y="412" font-family="sans-serif" font-size="18" fill="#333">0</text>
  <!-- plane element: cross-section in the XY plane, X >= 0 -->
  <polygon points="490,170 600,170 600,230 490,230" fill="#d6e4f0" stroke="#333" stroke-width="2"/>
  <line x1="545" y1="170" x2="545" y2="230" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="490" y1="200" x2="600" y2="200" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- radius r of a point of the element -->
  <line x1="330" y1="320" x2="545" y2="320" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="545" y1="230" x2="545" y2="326" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="430" y="312" font-family="serif" font-style="italic" font-size="22" fill="#333">r</text>
  <!-- hoop direction theta along the front of the outer ring -->
  <path d="M 230 281 A 270 55 0 0 0 470 278" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="352" y="306" font-family="serif" font-style="italic" font-size="22" fill="#333">θ</text>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="300" cy="80" r="11" fill="#c0392b"/><text x="300" y="85">1</text>
    <circle cx="640" cy="368" r="11" fill="#c0392b"/><text x="640" y="373">2</text>
    <circle cx="630" cy="200" r="11" fill="#c0392b"/><text x="630" y="205">3</text>
    <circle cx="430" cy="342" r="11" fill="#c0392b"/><text x="430" y="347">4</text>
    <circle cx="210" cy="300" r="11" fill="#c0392b"/><text x="210" y="305">5</text>
    <circle cx="80" cy="200" r="11" fill="#c0392b"/><text x="80" y="205">6</text>
  </g>
</svg>

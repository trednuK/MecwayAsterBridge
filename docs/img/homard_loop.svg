<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <g stroke="#333" stroke-width="1.8" fill="none">
    <!-- 1: coarse Mecway mesh (quarter plate with a hole) -->
    <path d="M30,60 L130,60 L130,140 L70,140 A40,40 0 0 0 30,100 Z"/>
    <line x1="80" y1="60" x2="80" y2="140"/>
    <line x1="30" y1="100" x2="58" y2="72"/>
    <!-- 2: solve box -->
    <rect x="200" y="55" width="110" height="90" rx="6"/>
    <!-- 3: indicator: element bars -->
    <rect x="370" y="55" width="110" height="90" rx="6"/>
    <!-- 4: refine box -->
    <rect x="540" y="55" width="110" height="90" rx="6"/>
    <!-- 5: refined mesh, below -->
    <path d="M540,210 L650,210 L650,300 L584,300 A44,44 0 0 0 540,256 Z"/>
    <line x1="595" y1="210" x2="595" y2="300"/>
    <line x1="540" y1="256" x2="571" y2="225"/>
    <line x1="550" y1="236" x2="570" y2="256"/>
    <line x1="562" y1="222" x2="580" y2="246"/>
    <line x1="560" y1="268" x2="584" y2="252"/>
    <line x1="574" y1="282" x2="594" y2="264"/>
    <!-- 6: projected result on the original mesh -->
    <path d="M30,210 L130,210 L130,290 L70,290 A40,40 0 0 0 30,250 Z"/>
    <line x1="80" y1="210" x2="80" y2="290"/>
    <line x1="30" y1="250" x2="58" y2="222"/>
    <!-- arrows -->
    <line x1="140" y1="100" x2="196" y2="100" marker-end="url(#arr)"/>
    <line x1="310" y1="100" x2="366" y2="100" marker-end="url(#arr)"/>
    <line x1="480" y1="100" x2="536" y2="100" marker-end="url(#arr)"/>
    <line x1="595" y1="145" x2="595" y2="204" marker-end="url(#arr)"/>
    <!-- loop back: refined mesh -> solve -->
    <path d="M535,255 L255,255 L255,150" marker-end="url(#arr)"/>
    <!-- after the last loop: projection to the original mesh -->
    <path d="M540,300 C400,320 260,320 140,270" stroke-dasharray="7,5" marker-end="url(#arr)"/>
  </g>
  <!-- solve symbol: K u = f as matrix brackets -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <path d="M225,75 L220,75 L220,125 L225,125"/>
    <path d="M255,75 L260,75 L260,125 L255,125"/>
    <line x1="230" y1="90" x2="250" y2="90"/><line x1="230" y1="100" x2="250" y2="100"/><line x1="230" y1="110" x2="250" y2="110"/>
    <rect x="272" y="75" width="12" height="50"/>
  </g>
  <!-- indicator bars -->
  <g fill="#333">
    <rect x="385" y="120" width="10" height="15"/>
    <rect x="400" y="95" width="10" height="40"/>
    <rect x="415" y="70" width="10" height="65"/>
    <rect x="430" y="110" width="10" height="25"/>
    <rect x="445" y="125" width="10" height="10"/>
  </g>
  <line x1="380" y1="88" x2="470" y2="88" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- refine symbol: one square split in four -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <rect x="565" y="75" width="25" height="25"/><rect x="600" y="75" width="25" height="25"/>
    <line x1="612.5" y1="75" x2="612.5" y2="100"/><line x1="600" y1="87.5" x2="625" y2="87.5"/>
    <line x1="591" y1="87.5" x2="598" y2="87.5"/>
  </g>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">
    <circle cx="30" cy="40" r="11" fill="#c0392b"/><text x="30" y="45">1</text>
    <circle cx="200" cy="40" r="11" fill="#c0392b"/><text x="200" y="45">2</text>
    <circle cx="370" cy="40" r="11" fill="#c0392b"/><text x="370" y="45">3</text>
    <circle cx="540" cy="40" r="11" fill="#c0392b"/><text x="540" y="45">4</text>
    <circle cx="670" cy="215" r="11" fill="#c0392b"/><text x="670" y="220">5</text>
    <circle cx="30" cy="190" r="11" fill="#c0392b"/><text x="30" y="195">6</text>
  </g>
</svg>

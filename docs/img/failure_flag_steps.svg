<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <rect width="720" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- stored steps t1 .. t6 at x = 150, 240, 330, 420, 510, 600; failure at the third -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="3 4">
    <line x1="150" y1="30" x2="150" y2="440"/>
    <line x1="240" y1="30" x2="240" y2="440"/>
    <line x1="420" y1="30" x2="420" y2="440"/>
    <line x1="510" y1="30" x2="510" y2="440"/>
    <line x1="600" y1="30" x2="600" y2="440"/>
  </g>
  <line x1="330" y1="30" x2="330" y2="440" stroke="#333" stroke-width="1.5" stroke-dasharray="8 4"/>
  <!-- plot 1: plastic strain p against the limit -->
  <line x1="100" y1="140" x2="660" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="100" y1="140" x2="100" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="76" y="46" font-family="serif" font-style="italic" font-size="22" fill="#333">p</text>
  <text x="664" y="160" font-family="serif" font-style="italic" font-size="20" fill="#333">t</text>
  <line x1="100" y1="75" x2="650" y2="75" stroke="#333" stroke-width="1.2" stroke-dasharray="10 5"/>
  <polyline points="150,140 240,118 330,62 420,62 510,62 600,62" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <g fill="#2c5d8a"><circle cx="150" cy="140" r="4.5"/><circle cx="240" cy="118" r="4.5"/><circle cx="330" cy="62" r="4.5"/><circle cx="420" cy="62" r="4.5"/><circle cx="510" cy="62" r="4.5"/><circle cx="600" cy="62" r="4.5"/></g>
  <!-- plot 2: stress of the element -->
  <line x1="100" y1="270" x2="660" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="100" y1="270" x2="100" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="76" y="182" font-family="serif" font-style="italic" font-size="22" fill="#333">σ</text>
  <text x="664" y="290" font-family="serif" font-style="italic" font-size="20" fill="#333">t</text>
  <polyline points="150,222 240,196 330,185 420,268 510,268 600,268" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <g fill="#2c5d8a"><circle cx="150" cy="222" r="4.5"/><circle cx="240" cy="196" r="4.5"/><circle cx="330" cy="185" r="4.5"/><circle cx="420" cy="268" r="4.5"/><circle cx="510" cy="268" r="4.5"/><circle cx="600" cy="268" r="4.5"/></g>
  <!-- plot 3: element-node variable failed, 0 or 1 -->
  <line x1="100" y1="370" x2="660" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="100" y1="370" x2="100" y2="305" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="84" y="376" font-family="sans-serif" font-size="16" fill="#333" text-anchor="end">0</text>
  <text x="84" y="331" font-family="sans-serif" font-size="16" fill="#333" text-anchor="end">1</text>
  <line x1="94" y1="326" x2="106" y2="326" stroke="#333" stroke-width="1.5"/>
  <text x="664" y="390" font-family="serif" font-style="italic" font-size="20" fill="#333">t</text>
  <line x1="150" y1="370" x2="330" y2="370" stroke="#2c5d8a" stroke-width="2.5"/><line x1="420" y1="326" x2="600" y2="326" stroke="#2c5d8a" stroke-width="2.5"/>
  <g fill="#2c5d8a"><circle cx="150" cy="370" r="4.5"/><circle cx="240" cy="370" r="4.5"/><circle cx="330" cy="370" r="4.5"/><circle cx="420" cy="326" r="4.5"/><circle cx="510" cy="326" r="4.5"/><circle cx="600" cy="326" r="4.5"/></g>
  <!-- row 4: the element in Mecway's result view with hidden failed elements -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="135" y="402" width="30" height="30" fill="#d6e4f0"/>
    <rect x="225" y="402" width="30" height="30" fill="#d6e4f0"/>
    <rect x="315" y="402" width="30" height="30" fill="#d6e4f0"/>
  </g>
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <rect x="405" y="402" width="30" height="30"/>
    <rect x="495" y="402" width="30" height="30"/>
    <rect x="585" y="402" width="30" height="30"/>
  </g>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="630" cy="58" r="11" fill="#c0392b"/><text x="630" y="63">1</text>
    <circle cx="352" cy="44" r="11" fill="#c0392b"/><text x="352" y="49">2</text>
    <circle cx="555" cy="44" r="11" fill="#c0392b"/><text x="555" y="49">3</text>
    <circle cx="455" cy="250" r="11" fill="#c0392b"/><text x="455" y="255">4</text>
    <circle cx="390" cy="320" r="11" fill="#c0392b"/><text x="390" y="325">5</text>
    <circle cx="460" cy="417" r="11" fill="#c0392b"/><text x="460" y="422">6</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- left: one load cycle, stress against time -->
  <line x1="40" y1="300" x2="320" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="40" y1="320" x2="40" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="18" y="46" font-family="serif" font-style="italic" font-size="22" fill="#333">σ</text>
  <text x="314" y="322" font-family="serif" font-style="italic" font-size="20" fill="#333">t</text>
  <!-- sine: mean at y = 170, amplitude 90 (max y = 80, min y = 260) -->
  <path d="M 50 170 C 70 110, 90 80, 110 80 C 130 80, 150 110, 170 170 C 190 230, 210 260, 230 260 C 250 260, 270 230, 290 170" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <g stroke="#333" stroke-width="1" stroke-dasharray="5 4">
    <line x1="40" y1="80" x2="300" y2="80"/>
    <line x1="40" y1="260" x2="300" y2="260"/>
    <line x1="40" y1="170" x2="300" y2="170"/>
  </g>
  <!-- amplitude S (mean to max) and range (min to max) -->
  <line x1="255" y1="170" x2="255" y2="82" stroke="#333" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="227" y="132" font-family="serif" font-style="italic" font-size="20" fill="#333">S</text>
  <line x1="300" y1="258" x2="300" y2="82" stroke="#333" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="268" y="214" font-family="serif" font-style="italic" font-size="20" fill="#333">Δσ</text>
  <!-- right: Woehler table, log S against log N -->
  <line x1="400" y1="300" x2="700" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="400" y1="300" x2="400" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="378" y="46" font-family="serif" font-style="italic" font-size="22" fill="#333">S</text>
  <text x="690" y="324" font-family="serif" font-style="italic" font-size="22" fill="#333">N</text>
  <!-- table points (N increasing to the right, S decreasing) -->
  <polyline points="480,110 540,150 600,185 640,230" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <!-- above the last S: last segment extended -->
  <line x1="480" y1="110" x2="400" y2="56.7" stroke="#2c5d8a" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- N = 1 at the origin of the log N axis: the extension stops there -->
  <line x1="400" y1="294" x2="400" y2="306" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="326" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">1</text>
  <!-- below the first S: no damage (infinite life) -->
  <line x1="640" y1="230" x2="690" y2="230" stroke="#2c5d8a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
  <g fill="#2c5d8a"><circle cx="480" cy="110" r="5"/><circle cx="540" cy="150" r="5"/><circle cx="600" cy="185" r="5"/><circle cx="640" cy="230" r="5"/></g>
  <!-- leader line of marker 6 -->
  <line x1="621" y1="173" x2="605" y2="182" stroke="#c0392b" stroke-width="1.5"/>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="110" cy="58" r="11" fill="#c0392b"/><text x="110" y="63">1</text>
    <circle cx="230" cy="283" r="11" fill="#c0392b"/><text x="230" y="288">2</text>
    <circle cx="190" cy="152" r="11" fill="#c0392b"/><text x="190" y="157">3</text>
    <circle cx="232" cy="104" r="11" fill="#c0392b"/><text x="232" y="109">4</text>
    <circle cx="324" cy="130" r="11" fill="#c0392b"/><text x="324" y="135">5</text>
    <circle cx="630" cy="166" r="11" fill="#c0392b"/><text x="630" y="171">6</text>
    <circle cx="575" cy="150" r="11" fill="#c0392b"/><text x="575" y="155">7</text>
    <circle cx="670" cy="208" r="11" fill="#c0392b"/><text x="670" y="213">8</text>
    <circle cx="452" cy="72" r="11" fill="#c0392b"/><text x="452" y="77">9</text>
  </g>
</svg>

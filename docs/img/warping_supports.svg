<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <!-- left: cantilever with a clamp (Fixed support) -->
  <line x1="60" y1="60" x2="60" y2="200" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="60" y1="70" x2="42" y2="88"/><line x1="60" y1="95" x2="42" y2="113"/>
    <line x1="60" y1="120" x2="42" y2="138"/><line x1="60" y1="145" x2="42" y2="163"/>
    <line x1="60" y1="170" x2="42" y2="188"/>
  </g>
  <rect x="60" y="120" width="260" height="20" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="130" r="5" fill="#333"/>
  <!-- end torque T about the beam axis x -->
  <path d="M330 104 A26 26 0 1 1 330 156" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M330 156 L342 150 L340 164 Z" fill="#333"/>
  <text x="352" y="118" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">T</text>
  <line x1="60" y1="240" x2="330" y2="240" stroke="#333" stroke-width="1.5"/>
  <path d="M338 240 L324 234 L324 246 Z" fill="#333"/>
  <text x="340" y="266" font-family="sans-serif" font-size="18" font-style="italic" fill="#333">x</text>
  <!-- right: beam on fork supports at both ends -->
  <rect x="430" y="120" width="280" height="20" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <g fill="none" stroke="#333" stroke-width="2">
    <path d="M430 140 L414 172 L446 172 Z"/>
    <path d="M710 140 L694 172 L726 172 Z"/>
    <line x1="404" y1="180" x2="456" y2="180"/>
    <circle cx="700" cy="178" r="4"/><circle cx="720" cy="178" r="4"/>
    <line x1="684" y1="186" x2="736" y2="186"/>
    <!-- fork prongs: the twist about x is held -->
    <path d="M418 96 V130 M442 96 V130"/>
    <path d="M698 96 V130 M722 96 V130"/>
  </g>
  <circle cx="430" cy="130" r="5" fill="#333"/>
  <circle cx="710" cy="130" r="5" fill="#333"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="86" cy="90" r="11" fill="#c0392b"/><text x="86" y="95">1</text>
    <circle cx="430" cy="74" r="11" fill="#c0392b"/><text x="430" y="79">2</text>
    <circle cx="710" cy="74" r="11" fill="#c0392b"/><text x="710" y="79">2</text>
    <circle cx="570" cy="210" r="11" fill="#c0392b"/><text x="570" y="215">3</text>
  </g>
</svg>

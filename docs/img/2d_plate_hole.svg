<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 720 245" width="720" height="245">
  <rect width="720" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- quarter of the plate: hole centre at the origin (lower left corner) -->
  <path d="M160,270 L580,270 L580,120 L130,120 L130,240 A30,30 0 0 1 160,270 Z" fill="#d6e4f0" stroke="#333" stroke-width="2"/>
  <path d="M130,240 A30,30 0 0 0 100,270 A30,30 0 0 0 130,300" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- symmetry X = 0: rollers on the left edge -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <circle cx="124" cy="140" r="6"/><circle cx="124" cy="175" r="6"/><circle cx="124" cy="210" r="6"/>
  </g>
  <line x1="117" y1="120" x2="117" y2="240" stroke="#333" stroke-width="2"/>
  <path d="M117,128 l-8,7 M117,148 l-8,7 M117,168 l-8,7 M117,188 l-8,7 M117,208 l-8,7 M117,228 l-8,7" stroke="#333" stroke-width="1.2"/>
  <!-- symmetry Y = 0: rollers on the bottom edge -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <circle cx="200" cy="276" r="6"/><circle cx="280" cy="276" r="6"/><circle cx="360" cy="276" r="6"/>
    <circle cx="440" cy="276" r="6"/><circle cx="520" cy="276" r="6"/>
  </g>
  <line x1="160" y1="283" x2="580" y2="283" stroke="#333" stroke-width="2"/>
  <path d="M175,283 l-7,8 M215,283 l-7,8 M255,283 l-7,8 M295,283 l-7,8 M335,283 l-7,8 M375,283 l-7,8 M415,283 l-7,8 M455,283 l-7,8 M495,283 l-7,8 M535,283 l-7,8 M575,283 l-7,8" stroke="#333" stroke-width="1.2"/>
  <!-- traction along X on the right edge -->
  <line x1="590" y1="135" x2="640" y2="135" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="590" y1="165" x2="640" y2="165" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="590" y1="195" x2="640" y2="195" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="590" y1="225" x2="640" y2="225" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="590" y1="255" x2="640" y2="255" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <!-- global axes, origin at the hole centre -->
  <line x1="130" y1="270" x2="230" y2="270" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="220" y="260" font-family="sans-serif" font-size="18" fill="#333">X</text>
  <line x1="130" y1="270" x2="130" y2="183" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="140" y="196" font-family="sans-serif" font-size="18" fill="#333">Y</text>
  <!-- markers -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">
    <circle cx="95" cy="303" r="11" fill="#c0392b"/><text x="95" y="308">1</text>
    <circle cx="92" cy="175" r="11" fill="#c0392b"/><text x="92" y="180">2</text>
    <circle cx="400" cy="308" r="11" fill="#c0392b"/><text x="400" y="313">3</text>
    <circle cx="666" cy="195" r="11" fill="#c0392b"/><text x="666" y="200">4</text>
    <circle cx="360" cy="195" r="11" fill="#c0392b"/><text x="360" y="200">5</text>
  </g>
</svg>
